<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar asistencia · Jhon & Keyla</title><meta name="description" content="Confirma tu asistencia a la boda de Jhon y Keyla."><style>
:root{--brown:#a37d4d;--ink:#443e37;--paper:#faf7f3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 Georgia,serif}main{max-width:620px;margin:auto;padding:46px 24px 60px;animation:arrive .8s ease both}header{text-align:center}h1{font-size:clamp(66px,16vw,92px);font-weight:normal;letter-spacing:.05em;color:var(--brown);margin:0 0 8px;line-height:1.2}.couple{font-style:italic;font-size:23px;margin:0 0 22px}.deadline{font:13px/1.7 Arial,sans-serif;letter-spacing:.17em;max-width:420px;margin:0 auto 32px;text-transform:uppercase}.guest{font-size:22px;margin:0 0 6px}.capacity{font:14px Arial,sans-serif;margin:0 0 28px}form{display:grid;gap:24px}fieldset{padding:0;margin:0;border:0}legend,.label{font:13px/1.5 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;display:block}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{position:relative;cursor:pointer;display:block}.choice input{position:absolute;opacity:0;width:1px;height:1px}.card{min-height:174px;border:1px solid #d9cec0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 12px;text-align:center;font:14px/1.5 Arial,sans-serif;letter-spacing:.1em;transition:background .3s,border .3s,box-shadow .3s,transform .3s}.heart{width:42px;height:42px;stroke:var(--brown);fill:transparent;stroke-width:1.4;transition:fill .3s,transform .3s}.choice input:checked+.card{border:2px solid var(--brown);box-shadow:0 4px 16px #a37d4d15}.yes input:checked+.card{background:#efe4d5}.yes input:checked+.card .heart{fill:var(--brown);animation:heartbeat .45s ease}.no .no-symbol{width:42px;height:42px;display:grid;place-items:center;border:1px solid #d9cec0;border-radius:50%;color:var(--brown);font-size:22px}.no input:checked+.card{background:#fffdf9}.no input:checked+.card .no-symbol::after{content:'✓'}.no input:not(:checked)+.card .no-symbol::after{content:'—'}.choice input:focus-visible+.card{outline:3px solid #a37d4d;outline-offset:4px}.field{display:block}input:not([type=radio]),select,textarea{width:100%;font:17px/1.4 Arial,sans-serif;color:var(--ink);padding:14px 15px;border:1px solid #bcb3a8;border-radius:10px;background:transparent;min-height:50px}input:focus,select:focus,textarea:focus{outline:2px solid var(--brown);outline-offset:2px}textarea{resize:vertical}#attendingFields{display:grid;gap:24px;animation:arrive .3s ease}.optional{font-size:12px;letter-spacing:0;text-transform:none}.submit{border:0;border-radius:14px;background:var(--brown);color:#fff;font:16px Arial,sans-serif;padding:17px 20px;cursor:pointer;min-height:52px}.submit:disabled{opacity:.65;cursor:wait}#status{margin:0;line-height:1.5;font-size:16px}footer{text-align:center;margin-top:34px;font-style:italic;font-size:18px}.hint{font:14px/1.5 Arial,sans-serif;margin:7px 0 0;color:#756b60}[hidden]{display:none!important}@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes heartbeat{50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:360px){main{padding:32px 18px}.choices{gap:10px}.card{font-size:12px;min-height:160px}}
</style></head><body><main><header><h1>RSVP</h1><p class="couple">Jhon &amp; Keyla</p><p class="deadline">Por favor confirma antes del 1 de noviembre</p></header><form id="form"><label class="field"><span class="label">Nombre o familia</span><input name="name" required maxlength="120" autocomplete="name" placeholder="Tu nombre o el de tu familia"></label><fieldset><legend class="sr-only">¿Asistirás a nuestra boda?</legend><div class="choices"><label class="choice yes"><input type="radio" name="attending" value="Sí" required><span class="card"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2 14.5 2 7.5C2 2 9 1 12 6c3-5 10-4 10 1.5C22 14.5 12 21 12 21Z"/></svg><span>ACEPTO<br>CON GUSTO</span></span></label><label class="choice no"><input type="radio" name="attending" value="No" required><span class="card"><span class="no-symbol" aria-hidden="true"></span><span>LO SIENTO,<br>NO PUEDO IR</span></span></label></div></fieldset><div id="attendingFields" hidden><label class="field"><span class="label">Número de invitados</span><input name="count" type="number" min="1" max="100" step="1" inputmode="numeric" placeholder="Incluyéndote a ti"></label><label class="field"><span class="label">Nombres de los invitados</span><textarea name="guests" maxlength="1000" rows="2" placeholder="Un nombre por línea"></textarea></label><label class="field"><span class="label">Restricciones alimentarias <span class="optional">(opcional)</span></span><input name="dietary" maxlength="500" placeholder="Ej. alergias, alimentación vegetariana"></label></div><label class="field"><span class="label">Información de contacto <span class="optional">(opcional)</span></span><input name="contact" maxlength="160" placeholder="Teléfono o correo electrónico"><span class="hint">Por si necesitamos comunicarnos contigo.</span></label><button class="submit" type="submit">Confirmar y guardar respuesta</button><p id="status" role="status" aria-live="polite"></p></form><footer>Con amor, Jhon &amp; Keyla</footer></main><script>
const form=document.getElementById('form'),status=document.getElementById('status');
form.addEventListener('change',()=>{const yes=form.elements.attending.value==='Sí';document.getElementById('attendingFields').hidden=!yes;form.elements.count.required=yes;form.elements.guests.required=yes;});
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button[type=submit]');button.disabled=true;status.textContent='Guardando tu respuesta…';try{let id;try{id=localStorage.getItem('physical-rsvp-id');if(!id){id=crypto.randomUUID();localStorage.setItem('physical-rsvp-id',id)}}catch{id=crypto.randomUUID()}const yes=form.elements.attending.value==='Sí';const response=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,path:location.pathname,name:form.elements.name.value,attending:form.elements.attending.value,count:yes?Number(form.elements.count.value):0,guests:yes?form.elements.guests.value:'',dietary:yes?form.elements.dietary.value:'',contact:form.elements.contact.value})});const data=await response.json();if(!response.ok||!data.ok)throw Error();status.textContent=yes?'¡Gracias! Tu asistencia quedó confirmada.':'Gracias por avisarnos. Tu respuesta quedó guardada.';}catch{status.textContent='No se pudo guardar tu respuesta. Por favor, intenta de nuevo.'}finally{button.disabled=false}};
</script></body></html>
